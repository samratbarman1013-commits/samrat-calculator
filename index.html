<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<title>Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  :root {
    --bg: #0f172a;
    --display-bg: #1e293b;
    --btn: #334155;
    --btn-alt: #475569;
    --accent: #f59e0b;
    --text: #f8fafc;
    --muted: #94a3b8;
    --radius: 14px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: stretch;
    user-select: none;
    overscroll-behavior: none;
  }
  .app {
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: env(safe-area-inset-top) 12px calc(12px + env(safe-area-inset-bottom));
  }
  .display {
    flex: 1;
    background: var(--display-bg);
    border-radius: var(--radius);
    margin-bottom: 14px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: flex-end;
    overflow: hidden;
    min-height: 120px;
  }
  .history {
    font-size: 1.1rem;
    color: var(--muted);
    min-height: 1.6em;
    word-break: break-all;
    text-align: right;
    line-height: 1.4;
  }
  .result {
    font-size: clamp(2.2rem, 10vw, 3.4rem);
    font-weight: 600;
    word-break: break-all;
    text-align: right;
    line-height: 1.2;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    flex: 5;
    max-height: 460px;
  }
  button {
    border: none;
    border-radius: var(--radius);
    background: var(--btn);
    color: var(--text);
    font-size: 1.6rem;
    font-weight: 500;
    cursor: pointer;
    transition: filter 0.08s, transform 0.05s;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button:active { filter: brightness(1.25); transform: scale(0.97); }
  .fn { background: var(--btn-alt); color: var(--accent); }
  .op { background: var(--accent); color: #1c1917; }
  .op:active { filter: brightness(0.9); }
  .zero { grid-column: span 2; }
  .history-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px 10px;
    min-height: 40px;
  }
  .history-bar .title {
    font-size: 0.95rem;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.05em;
  }
  .history-bar button {
    background: transparent;
    color: var(--muted);
    font-size: 0.85rem;
    padding: 6px 10px;
    border-radius: 8px;
    min-width: 0;
  }
  .history-list {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.97);
    z-index: 10;
    display: none;
    flex-direction: column;
    padding: calc(20px + env(safe-area-inset-top)) 20px 20px;
  }
  .history-list.open { display: flex; }
  .history-list h2 {
    font-size: 1.1rem;
    margin-bottom: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .history-list h2 button {
    background: var(--btn);
    font-size: 0.85rem;
    padding: 8px 14px;
  }
  .history-list ul {
    list-style: none;
    overflow-y: auto;
    flex: 1;
  }
  .history-list li {
    padding: 14px 4px;
    border-bottom: 1px solid #1e293b;
    cursor: pointer;
    text-align: right;
  }
  .history-list li .expr { color: var(--muted); font-size: 0.95rem; }
  .history-list li .val { font-size: 1.4rem; font-weight: 600; }
  .empty { color: var(--muted); text-align: center; margin-top: 40px; }
</style>
</head>
<body>
<div class="app">
  <div class="history-bar">
    <span class="title">CALCULATOR</span>
    <button id="toggleHistory">History</button>
  </div>
  <div class="display">
    <div class="history" id="histLine"></div>
    <div class="result" id="display">0</div>
  </div>
  <div class="keys">
    <button class="fn" data-action="clear">AC</button>
    <button class="fn" data-action="sign">+/-</button>
    <button class="fn" data-action="percent">%</button>
    <button class="op" data-op="/">÷</button>
    <button data-num="7">7</button>
    <button data-num="8">8</button>
    <button data-num="9">9</button>
    <button class="op" data-op="*">×</button>
    <button data-num="4">4</button>
    <button data-num="5">5</button>
    <button data-num="6">6</button>
    <button class="op" data-op="-">−</button>
    <button data-num="1">1</button>
    <button data-num="2">2</button>
    <button data-num="3">3</button>
    <button class="op" data-op="+">+</button>
    <button class="zero" data-num="0">0</button>
    <button data-action="dot">.</button>
    <button class="op" data-action="equals">=</button>
  </div>
</div>

<div class="history-list" id="historyPanel">
  <h2>History <button id="closeHistory">Close</button></h2>
  <ul id="historyItems"></ul>
</div>

<script>
(function () {
  const displayEl = document.getElementById('display');
  const histLineEl = document.getElementById('histLine');
  const historyPanel = document.getElementById('historyPanel');
  const historyItems = document.getElementById('historyItems');

  let current = '0';
  let stored = null;
  let op = null;
  let freshEntry = true;
  let history = [];

  try { history = JSON.parse(localStorage.getItem('calcHistory') || '[]'); } catch (e) { history = []; }

  function fmt(n) {
    if (n === 'Error') return n;
    const s = typeof n === 'string' ? n : String(n);
    if (s.includes('e')) return s;
    const [i, d] = s.split('.');
    const ii = i.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return d !== undefined ? ii + '.' + d : ii;
  }

  function raw(v) {
    return String(v).replace(/,/g, '');
  }

  function render() {
    displayEl.textContent = fmt(current);
    histLineEl.textContent = stored !== null && op ? fmt(stored) + ' ' + op : '';
  }

  function saveHistory() {
    try { localStorage.setItem('calcHistory', JSON.stringify(history.slice(0, 50))); } catch (e) {}
  }

  function compute() {
    const a = parseFloat(stored), b = parseFloat(raw(current));
    let r;
    switch (op) {
      case '+': r = a + b; break;
      case '-': r = a - b; break;
      case '*': r = a * b; break;
      case '/': r = b === 0 ? NaN : a / b; break;
      default: return;
    }
    if (!isFinite(r) || isNaN(r)) return 'Error';
    return String(Math.round(r * 1e12) / 1e12);
  }

  function inputNum(n) {
    if (current === 'Error') current = '0';
    if (freshEntry) { current = n; freshEntry = false; }
    else {
      if (raw(current).replace('.', '').replace('-', '').length >= 12) return;
      current = current === '0' ? n : current + n;
    }
  }

  function setOp(nextOp) {
    if (current === 'Error') return;
    if (stored !== null && op && !freshEntry) {
      const r = compute();
      if (r === 'Error') { current = 'Error'; stored = null; op = null; render(); return; }
      stored = r; current = r;
    } else {
      stored = raw(current);
    }
    op = nextOp;
    freshEntry = true;
    render();
  }

  function equals() {
    if (stored === null || !op) return;
    const expr = fmt(stored) + ' ' + op + ' ' + fmt(current) + ' =';
    const r = compute();
    if (r === 'Error') {
      current = 'Error'; stored = null; op = null; freshEntry = true;
      render(); return;
    }
    history.unshift({ expr: expr, val: fmt(r) });
    saveHistory();
    current = r; stored = null; op = null; freshEntry = true;
    render();
  }

  function clearAll() { current = '0'; stored = null; op = null; freshEntry = true; render(); }

  document.querySelector('.keys').addEventListener('click', function (e) {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.num) inputNum(btn.dataset.num);
    else if (btn.dataset.op) setOp(btn.dataset.op);
    else switch (btn.dataset.action) {
      case 'clear': clearAll(); break;
      case 'sign': if (current !== 'Error' && current !== '0') current = raw(current).startsWith('-') ? raw(current).slice(1) : '-' + raw(current); break;
      case 'percent': if (current !== 'Error') current = String(parseFloat(raw(current)) / 100); break;
      case 'dot':
        if (freshEntry) { current = '0.'; freshEntry = false; }
        else if (!current.includes('.')) current += '.';
        break;
      case 'equals': equals(); break;
    }
    render();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key >= '0' && e.key <= '9') inputNum(e.key);
    else if ('+-*/'.includes(e.key)) setOp(e.key);
    else if (e.key === 'Enter' || e.key === '=') equals();
    else if (e.key === 'Escape') clearAll();
    else if (e.key === '.') { if (!current.includes('.')) current += '.'; }
    else if (e.key === 'Backspace') {
      if (current !== 'Error' && current.length > 1) current = current.slice(0, -1);
      else current = '0';
    }
    render();
  });

  function renderHistory() {
    historyItems.innerHTML = '';
    if (!history.length) {
      historyItems.innerHTML = '<li class="empty" style="cursor:default">No calculations yet</li>';
      return;
    }
    history.forEach(function (h) {
      const li = document.createElement('li');
      li.innerHTML = '<div class="expr"></div><div class="val"></div>';
      li.querySelector('.expr').textContent = h.expr;
      li.querySelector('.val').textContent = h.val;
      li.addEventListener('click', function () {
        current = raw(h.val); freshEntry = true; stored = null; op = null;
        render(); historyPanel.classList.remove('open');
      });
      historyItems.appendChild(li);
    });
  }

  document.getElementById('toggleHistory').addEventListener('click', function () {
    renderHistory(); historyPanel.classList.add('open');
  });
  document.getElementById('closeHistory').addEventListener('click', function () {
    historyPanel.classList.remove('open');
  });
  historyItems.addEventListener('click', function (e) {
    if (e.target === historyItems && history.length) {
      if (confirm('Clear all history?')) { history = []; saveHistory(); renderHistory(); }
    }
  });

  render();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
